name: Cross-platform CMake Qt

on:
  push:
    paths:
      - '.github/workflows/cmake-qt.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/portable/**'
      - 'src/platform/**'
      - 'src/qt/**'
      - 'res/**'
      - 'third_party/**'
      - 'tests/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cmake-qt.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/portable/**'
      - 'src/platform/**'
      - 'src/qt/**'
      - 'res/**'
      - 'third_party/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Qt 6.8 still references AGL, which Apple removed from macOS 26.
        # Keep the LTS toolchain on macOS 15 until the project raises its
        # minimum Qt version to a release that no longer links AGL.
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install compression libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev liblzma-dev libzstd-dev qemu-utils

      - name: Install compression libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install bzip2 xz zstd

      - name: Install compression libraries (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows-static-md bzip2:x64-windows-static-md liblzma:x64-windows-static-md zstd:x64-windows-static-md

      - name: Configure (Linux and macOS)
        if: runner.os != 'Windows'
        run: cmake --preset dev -DRUFUSPP_STRICT_WARNINGS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake --preset dev
          -DRUFUSPP_STRICT_WARNINGS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build --preset dev --config Debug

      - name: Test
        run: ctest --preset dev -C Debug

      - name: Configure unsigned-root development mode (macOS)
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build/macos-unsigned-root
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DRUFUSPP_BUILD_QT_APP=ON
          -DRUFUSPP_MACOS_UNSIGNED_ROOT_MODE=ON
          -DRUFUSPP_STRICT_WARNINGS=ON

      - name: Build unsigned-root development mode (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build/macos-unsigned-root --config Debug

      - name: Test unsigned-root development mode (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build/macos-unsigned-root -C Debug --output-on-failure
