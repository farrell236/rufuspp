name: Build Development

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: RelWithDebInfo
        type: choice
        options:
          - RelWithDebInfo
          - Debug

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/package-build.yml
    with:
      build_type: ${{ inputs.configuration }}
      version: 0.2.1-dev.${{ github.run_number }}
      retention_days: 14

